<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>택시 요금 계산 프로그램</title>
  <script type="module" src="https://pyscript.net/releases/2024.11.1/core.js"></script>
  <style>
    body { font-family: sans-serif; background: #f4f6f8; display: flex; justify-content: center; padding: 40px 16px; }
    .box { background: #fff; padding: 28px; border-radius: 12px; width: 100%; max-width: 380px; box-shadow: 0 2px 10px rgba(0,0,0,.1); }
    h1 { font-size: 20px; text-align: center; margin-top: 0; }
    label { display: block; margin: 14px 0 4px; font-size: 14px; }
    input { width: 100%; padding: 10px; font-size: 16px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; margin-top: 14px; font-size: 16px; border: 0; border-radius: 8px; cursor: pointer; background: #fcc419; }
    #result { margin-top: 18px; font-size: 17px; text-align: center; font-weight: bold; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🚕 택시 요금 계산 프로그램</h1>
    <label>이동 거리(km)</label>
    <input id="distance" type="number" step="0.01" placeholder="예: 3.05">
    <label>예상 시간(분)</label>
    <input id="minutes" type="number" step="1" placeholder="예: 17">
    <button id="calc">택시 요금 계산</button>
    <div id="result"></div>
  </div>

  <script type="py">
from pyscript import document, when

@when("click", "#calc")
def calc(event):
    try:
        distance = float(document.querySelector("#distance").value)
        minutes = int(document.querySelector("#minutes").value)
    except ValueError:
        document.querySelector("#result").innerText = "숫자를 입력하세요."
        return

    if distance <= 0 or minutes <= 0:
        text = "잘못된 입력입니다. 0보다 큰 값을 입력하세요."
    else:
        if distance <= 1.6:
            fare = 4800
        else:
            fare = 4800 + int((distance - 1.6) / 0.131) * 100
        fare = fare + minutes * 100
        text = "목적지까지의 택시 예상 비용은 " + str(fare) + "원 입니다."
    document.querySelector("#result").innerText = text
  </script>
</body>
</html>
