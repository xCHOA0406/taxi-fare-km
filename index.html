<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>택시 요금 계산 프로그램</title>
  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>
  <style>
    body { font-family: sans-serif; background: #f1f3f5; display: flex; justify-content: center; padding: 24px 12px; }
    .box { width: 100%; max-width: 560px; }
    h1 { font-size: 20px; text-align: center; margin: 0 0 12px; }
    #out { background: #212529; color: #69db7c; padding: 14px; border-radius: 8px 8px 0 0;
           height: 420px; overflow-y: auto; white-space: pre-wrap; font-family: monospace; font-size: 15px; margin: 0; }
    #bar { display: flex; }
    #in { flex: 1; padding: 12px; font-size: 16px; border: 0; background: #343a40; color: #fff; border-radius: 0 0 0 8px; }
    #send { padding: 0 20px; font-size: 16px; border: 0; background: #fcc419; border-radius: 0 0 8px 0; cursor: pointer; }
    #restart { width: 100%; margin-top: 10px; padding: 10px; font-size: 15px; border: 0; border-radius: 8px; background: #dee2e6; cursor: pointer; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🚕 택시비 예상 프로그램</h1>
    <pre id="out"></pre>
    <div id="bar">
      <input id="in" type="text" placeholder="여기에 입력하고 Enter" autocomplete="off" disabled>
      <button id="send" disabled>입력</button>
    </div>
    <button id="restart">프로그램 다시 시작</button>
  </div>

  <!-- 파이썬 코드 (계획서대로) -->
  <script id="code" type="text/plain">
# 택시비 예상 프로그램

distance = 0
minutes = 0
fare = 0

while True:
    print("===========================")
    print("     택시 요금 계산 프로그램")
    print("===========================")
    print("1. 이동 거리 입력")
    print("2. 이동 시간 입력")
    print("3. 택시 요금 계산")
    print("4. 예상 요금 확인")
    print("5. 프로그램 종료")
    print("===========================")
    choice = input("메뉴를 선택하세요: ")

    if choice == "1":
        distance = float(input("이동 거리(km): "))
        if distance <= 0:
            print("잘못된 입력입니다.")
            distance = 0
        else:
            print("이동 거리 저장 완료")

    elif choice == "2":
        minutes = int(input("예상 시간(분): "))
        if minutes <= 0:
            print("잘못된 입력입니다.")
            minutes = 0
        else:
            print("예상 시간 저장 완료")

    elif choice == "3":
        if distance <= 0 or minutes <= 0:
            print("1번, 2번을 먼저 입력하세요.")
        else:
            if distance <= 1.6:
                fare = 4800
            else:
                fare = 4800 + int((distance - 1.6) / 0.131) * 100
            fare = fare + minutes * 100
            print("계산 완료! 4번에서 확인하세요.")

    elif choice == "4":
        if fare == 0:
            print("아직 계산된 요금이 없습니다. 3번을 먼저 하세요.")
        else:
            print("목적지까지의 택시 예상 비용은", fare, "원 입니다.")

    elif choice == "5":
        print("프로그램을 종료합니다.")
        break

    else:
        print("1~5 중에서 선택하세요.")

    print()
  </script>

  <!-- 파이썬을 화면에서 돌려 주는 장치 -->
  <script>
    var out = document.getElementById("out");
    var inp = document.getElementById("in");
    var send = document.getElementById("send");
    var pending = null;
    var runId = 0;

    function write(text) {
      out.appendChild(document.createTextNode(text));
      out.scrollTop = out.scrollHeight;
    }

    function submit() {
      if (!pending) return;
      var value = inp.value;
      inp.value = "";
      inp.disabled = true;
      send.disabled = true;
      write(value + "\n");
      var resolve = pending;
      pending = null;
      resolve(value);
    }

    send.addEventListener("click", submit);
    inp.addEventListener("keydown", function (e) {
      if (e.key === "Enter") submit();
    });

    function builtinRead(x) {
      if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined) {
        throw "File not found: '" + x + "'";
      }
      return Sk.builtinFiles["files"][x];
    }

    function myInput(promptText) {
      write(promptText);
      return new Promise(function (resolve) {
        pending = resolve;
        inp.disabled = false;
        send.disabled = false;
        inp.focus();
      });
    }

    function run() {
      runId++;
      var myRun = runId;
      out.textContent = "";
      pending = null;
      inp.disabled = true;
      send.disabled = true;

      Sk.pre = "out";
      Sk.configure({
        output: function (text) { if (myRun === runId) write(text); },
        read: builtinRead,
        inputfun: myInput,
        inputfunTakesPrompt: true,
        __future__: Sk.python3
      });

      var code = document.getElementById("code").textContent;
      Sk.misceval.asyncToPromise(function () {
        return Sk.importMainWithBody("<stdin>", false, code, true);
      }).then(function () {
        if (myRun === runId) write("\n[프로그램이 끝났습니다. 위의 '프로그램 다시 시작'을 누르세요.]\n");
      }).catch(function (err) {
        if (myRun === runId) write("\n[오류] " + err.toString() + "\n(숫자를 입력해야 하는 곳에 글자를 넣으면 이렇게 멈춥니다. 다시 시작해 주세요.)\n");
      });
    }

    document.getElementById("restart").addEventListener("click", run);
    run();
  </script>
</body>
</html>
