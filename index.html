<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>택시 요금 계산 프로그램</title>
  <link rel="stylesheet" href="https://pyscript.net/releases/2024.11.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2024.11.1/core.js"></script>
</head>
<body>
<script type="mpy" terminal worker>
# 택시비 예상 프로그램

while True:
    print("===========================")
    print("     택시 요금 계산 프로그램")
    print("===========================")
    print("1. 택시 요금 계산")
    print("2. 프로그램 종료")
    print("===========================")
    choice = input("메뉴를 선택하세요: ")

    if choice == "1":
        distance = float(input("이동 거리(km): "))
        minutes = int(input("예상 시간(분): "))

        if distance <= 0 or minutes <= 0:
            print("잘못된 입력입니다. 0보다 큰 값을 입력하세요.")
        else:
            if distance <= 1.6:
                fare = 4800
            else:
                fare = 4800 + int((distance - 1.6) / 0.131) * 100
            fare = fare + minutes * 100
            print("목적지까지의 택시 예상 비용은", fare, "원 입니다.")
        print()

    elif choice == "2":
        print("프로그램을 종료합니다.")
        break

    else:
        print("1 또는 2를 입력하세요.")
        print()
</script>
</body>
</html>
