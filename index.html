<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>택시 요금 계산 프로그램</title>
  <script src="./mini-coi.js"></script>
  <link rel="stylesheet" href="https://pyscript.net/releases/2024.11.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2024.11.1/core.js"></script>
</head>
<body>
<script type="py" terminal worker>
# 택시비 예상 프로그램

distance = 0
minutes = 0
fare = 0

while True:
    print("===========================")
    print("     택시 요금 계산 프로그램")
    print("===========================")
    print("1. 이동 거리 입력")
    print("2. 이동 시간 입력")
    print("3. 택시 요금 계산")
    print("4. 예상 요금 확인")
    print("5. 프로그램 종료")
    print("===========================")
    choice = input("메뉴를 선택하세요: ")

    if choice == "1":
        distance = float(input("이동 거리(km): "))
        if distance <= 0:
            print("잘못된 입력입니다.")
            distance = 0
        else:
            print("이동 거리 저장 완료")

    elif choice == "2":
        minutes = int(input("예상 시간(분): "))
        if minutes <= 0:
            print("잘못된 입력입니다.")
            minutes = 0
        else:
            print("예상 시간 저장 완료")

    elif choice == "3":
        if distance <= 0 or minutes <= 0:
            print("1번, 2번을 먼저 입력하세요.")
        else:
            if distance <= 1.6:
                fare = 4800
            else:
                fare = 4800 + int((distance - 1.6) / 0.131) * 100
            fare = fare + minutes * 100
            print("계산 완료! 4번에서 확인하세요.")

    elif choice == "4":
        if fare == 0:
            print("아직 계산된 요금이 없습니다. 3번을 먼저 하세요.")
        else:
            print("목적지까지의 택시 예상 비용은", fare, "원 입니다.")

    elif choice == "5":
        print("프로그램을 종료합니다.")
        break

    else:
        print("1~5 중에서 선택하세요.")

    print()
</script>
</body>
</html>
